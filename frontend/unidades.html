<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades - Sistema Almoxarifado</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css">
    <style>
        /* Tema escuro para o combobox de busca (Choices.js) */
        .choices__inner {
            background: var(--bg-input) !important;
            border: 1.5px solid var(--borda) !important;
            border-radius: 8px !important;
            min-height: unset !important;
            padding: 0.6rem 0.8rem !important;
        }
        .choices.is-focused .choices__inner,
        .choices.is-open .choices__inner {
            border-color: var(--azul) !important;
        }
        .choices__list--single .choices__item,
        .choices__placeholder {
            color: var(--texto) !important;
            opacity: 1 !important;
        }
        .choices__list--dropdown,
        .choices__list[aria-expanded] {
            background: var(--bg-card) !important;
            border: 1.5px solid var(--borda) !important;
            border-radius: 8px !important;
            margin-top: 4px !important;
        }
        .choices__list--dropdown .choices__item--selectable,
        .choices__list[aria-expanded] .choices__item--selectable {
            color: var(--texto) !important;
        }
        .choices__list--dropdown .choices__item--selectable.is-highlighted,
        .choices__list[aria-expanded] .choices__item--selectable.is-highlighted {
            background: rgba(79, 142, 247, 0.15) !important;
        }
        .choices__input {
            background: var(--bg-card) !important;
            color: var(--texto) !important;
        }
    </style>
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div style="width:36px;height:36px;background:rgba(79,142,247,0.2);
                border-radius:8px;display:flex;align-items:center;
                justify-content:center;font-size:1.2rem;">📦</div>
            <div>
                <h2>Almoxarifado</h2>
                <p>Sistema de Estoque</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html"><span>📊</span> Dashboard</a>
            <a href="equipamentos.html"><span>🔧</span> Cadastro de Equipamentos</a>
            <a href="unidades.html" class="ativo"><span>📷</span> Unidades</a>
            <a href="movimentacoes.html"><span>🔄</span> Movimentações</a>
            <a href="fornecedores.html"><span>🏭</span> Fornecedores</a>
            <a href="tecnicos.html" id="linkTecnicos"><span>👷</span> Técnicos</a>
            <a href="relatorios.html"><span>📄</span> Relatórios</a>
            <a href="usuarios.html"><span>👥</span> Usuários</a>
        </nav>

        <div class="sidebar-user">
            <div class="avatar" id="avatarLetra">A</div>
            <div class="sidebar-user-info">
                <p id="sidebarNome">Usuário</p>
                <span id="sidebarPerfil">Administrador</span>
            </div>
        </div>

        <div style="padding:0.75rem 1rem;padding-top:0;">
            <button class="btn btn-danger" onclick="sair()"
                style="width:100%;justify-content:center;">
                🚪 Sair
            </button>
        </div>
    </aside>

    <!-- CONTEÚDO -->
    <div class="main-content">

        <div class="topbar">
    <h1>📷 Unidades por Código de Barras</h1>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0;">
        <div id="seletorEmpresa" style="position:relative;">
    <button id="btnEmpresa" onclick="toggleDropdownEmpresa()" style="
        color:#8892a4;font-size:0.82rem;
        padding:0.3rem 0.75rem;
        background:rgba(79,142,247,0.08);
        border:1px solid rgba(79,142,247,0.15);
        border-radius:999px;white-space:nowrap;
        cursor:pointer;display:flex;align-items:center;gap:0.4rem;">
        <span id="nomeEmpresa"></span>
        <span id="setaEmpresa" style="display:none;">▾</span>
    </button>
    <div id="dropdownEmpresa" style="display:none;position:absolute;top:110%;right:0;
        background:#1a1f2e;border:1px solid rgba(79,142,247,0.2);
        border-radius:8px;min-width:160px;z-index:50;overflow:hidden;">
    </div>
</div>
        <div class="badge-online" style="white-space:nowrap;">Sistema Online</div>
    </div>
</div>

        <div class="page-content">

            <div id="msgSucesso" class="alerta alerta-sucesso" style="display:none;"></div>
            <div id="msgErro"    class="alerta alerta-erro"    style="display:none;"></div>

            <!-- ============================================
                 PAINEL DE CADASTRO DE UNIDADES
                 ============================================ -->
            <div class="card" style="margin-bottom:1.5rem;">
                <div class="card-header">
                    <h2>➕ Cadastrar Nova Unidade</h2>
                </div>

                <div style="display:grid;
                            grid-template-columns:2fr 1fr 1fr auto;
                            gap:1rem;align-items:flex-end;">

                    <div class="form-group" style="margin:0;">
                        <label>Equipamento *</label>
                        <select id="cadEquipamento">
                            <option value="">-- Selecione o equipamento --</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label>Código de Barras *</label>
                        <input type="text" id="cadCodigo"
                            placeholder="Aponte o leitor aqui">
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label>Número de Série</label>
                        <input type="text" id="cadSerie"
                            placeholder="Opcional">
                    </div>

                    <button class="btn btn-primary" onclick="cadastrarUnidade()"
                        style="margin-bottom:0;white-space:nowrap;">
                        ➕ Cadastrar
                    </button>

                </div>
            </div>

            <!-- ============================================
                 LISTA DE UNIDADES AGRUPADAS POR EQUIPAMENTO
                 ============================================ -->
            <div class="card">
                <div class="card-header">
                    <h2>📋 Unidades Cadastradas</h2>
                    <div style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;">
                        <!-- Busca por texto (código de barras, série ou equipamento) -->
                        <input type="text" id="buscaUnidades"
                            placeholder="🔍 Buscar por código, série ou equipamento..."
                            oninput="filtrarUnidades()"
                            style="padding:0.5rem 1rem;min-width:240px;
                                   background:#1e2235;
                                   border:1.5px solid #2a2d3e;
                                   border-radius:8px;color:#e2e8f0;
                                   font-family:inherit;font-size:0.875rem;">
                        <!-- Filtro por equipamento -->
                        <select id="filtroEquipamento"
                            onchange="filtrarUnidades()"
                            style="padding:0.5rem 1rem;
                                   background:#1e2235;
                                   border:1.5px solid #2a2d3e;
                                   border-radius:8px;color:#e2e8f0;
                                   font-family:inherit;font-size:0.875rem;">
                            <option value="">Todos os equipamentos</option>
                        </select>
                        <!-- Filtro por status -->
                        <select id="filtroStatus"
                            onchange="filtrarUnidades()"
                            style="padding:0.5rem 1rem;
                                   background:#1e2235;
                                   border:1.5px solid #2a2d3e;
                                   border-radius:8px;color:#e2e8f0;
                                   font-family:inherit;font-size:0.875rem;">
                            <option value="">Todos os status</option>
                            <option value="disponivel">✅ Disponível</option>
                            <option value="em_uso">📤 Em Uso</option>
                            <option value="manutencao">🔧 Manutenção</option>
                            <option value="inativo">⛔ Inativo</option>
                        </select>
                    </div>
                </div>

                <!-- Unidades agrupadas por equipamento -->
                <div id="listaUnidades">
                    <div style="text-align:center;color:#8892a4;padding:2rem;">
                        Carregando...
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js"></script>
<script>
    const token   = localStorage.getItem("token");
    const usuario = JSON.parse(localStorage.getItem("usuario") || "{}");
    if (!token) window.location.href = "login.html";

    const nome = usuario.nome || "Usuário";
    document.getElementById("sidebarNome").textContent = nome;
    document.getElementById("avatarLetra").textContent = nome.charAt(0).toUpperCase();
    const perfis = { admin:"Administrador", operador:"Operador", visitante:"Visitante" };
    document.getElementById("sidebarPerfil").textContent =
        perfis[usuario.perfil] || usuario.perfil;
    if (usuario.perfil !== "admin") {
        const linkTecnicos = document.getElementById("linkTecnicos");
        if (linkTecnicos) linkTecnicos.style.display = "none";
    }

    // Mostra o nome da empresa no topbar
    document.getElementById("nomeEmpresa").textContent =
        "🏢 " + (usuario.empresa_nome || "");
        // ============================================================
    // Troca de empresa (só Super Admin)
    // ============================================================
    const empresasDisponiveis = [
        { id: 1, nome: "Matriz" },
        { id: 2, nome: "Filial" }
    ];

    if (usuario.acesso_todas) {
        document.getElementById("setaEmpresa").style.display = "inline";
        montarDropdownEmpresa();
    } else {
        document.getElementById("btnEmpresa").style.cursor = "default";
    }

    function montarDropdownEmpresa() {
        const dropdown = document.getElementById("dropdownEmpresa");
        dropdown.innerHTML = empresasDisponiveis.map(e => `
            <div onclick="trocarEmpresa(${e.id})" style="
                padding:0.6rem 1rem;cursor:pointer;font-size:0.85rem;
                color:#e2e8f0;"
                onmouseover="this.style.background='rgba(79,142,247,0.1)'"
                onmouseout="this.style.background='transparent'">
                ${e.nome}
            </div>
        `).join("");
    }

    function toggleDropdownEmpresa() {
        if (!usuario.acesso_todas) return;
        const dropdown = document.getElementById("dropdownEmpresa");
        dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }

    async function trocarEmpresa(idEmpresa) {
        if (idEmpresa === usuario.id_empresa) {
            document.getElementById("dropdownEmpresa").style.display = "none";
            return;
        }
        try {
            const resposta = await fetch(`${API_URL}/api/auth/trocar-empresa`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ id_empresa: idEmpresa })
            });
            const dados = await resposta.json();
            if (resposta.ok) {
                localStorage.setItem("token", dados.token);
                localStorage.setItem("usuario", JSON.stringify(dados.usuario));
                window.location.reload();
            } else {
                alert("Erro ao trocar de empresa: " + dados.erro);
            }
        } catch (e) {
            alert("Erro ao conectar com o servidor.");
        }
    }

    // Fecha o dropdown se clicar fora dele
    document.addEventListener("click", (e) => {
        const seletor = document.getElementById("seletorEmpresa");
        if (seletor && !seletor.contains(e.target)) {
            document.getElementById("dropdownEmpresa").style.display = "none";
        }
    });

    let todasUnidades  = [];      // todas as unidades carregadas

    // Combobox com busca (Choices.js) pro campo Equipamento do cadastro -
    // mesmo padrão já usado em outras telas do sistema
    const choicesCadEquipamento = new Choices("#cadEquipamento", {
        searchEnabled: true,
        searchPlaceholderValue: "Buscar equipamento...",
        noResultsText: "Nenhum equipamento encontrado",
        noChoicesText: "Nenhum equipamento cadastrado",
        itemSelectText: "",
        shouldSort: false,
        fuseOptions: { threshold: 0, ignoreLocation: true, minMatchCharLength: 1 }
    });

    // ============================================================
    // Cadastra uma nova unidade
    // ============================================================
    async function cadastrarUnidade() {
        const dados = {
            id_equipamento: document.getElementById("cadEquipamento").value,
            codigo_barras:  document.getElementById("cadCodigo").value,
            numero_serie:   document.getElementById("cadSerie").value
        };

        if (!dados.id_equipamento || !dados.codigo_barras) {
            mostrarErro("Equipamento e código de barras são obrigatórios!");
            return;
        }

        try {
            const r = await fetch(`${API_URL}/api/unidades/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(dados)
            });
            const resultado = await r.json();

            if (r.ok) {
                mostrarSucesso(resultado.mensagem);
                document.getElementById("cadCodigo").value  = "";
                document.getElementById("cadSerie").value   = "";
                carregarUnidades();
                // Foca no campo de código para cadastrar a próxima rapidamente
                document.getElementById("cadCodigo").focus();
            } else {
                mostrarErro(resultado.erro);
            }
        } catch (e) { mostrarErro("Erro ao cadastrar unidade"); }
    }

    // ============================================================
    // Carrega e exibe as unidades agrupadas por equipamento
    // ============================================================
    async function carregarUnidades() {
        try {
            const r = await fetch(`${API_URL}/api/unidades/`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            todasUnidades = await r.json();
            renderizarUnidades(todasUnidades);
        } catch (e) { console.error(e); }
    }

    function filtrarUnidades() {
        const busca        = document.getElementById("buscaUnidades").value.trim().toLowerCase();
        const filtroEq      = document.getElementById("filtroEquipamento").value;
        const filtroStatus  = document.getElementById("filtroStatus").value;

        let resultado = [...todasUnidades];
        if (busca) resultado = resultado.filter(u =>
            (u.codigo_barras || "").toLowerCase().includes(busca) ||
            (u.numero_serie || "").toLowerCase().includes(busca) ||
            (u.equipamento_nome || "").toLowerCase().includes(busca));
        if (filtroEq)     resultado = resultado.filter(u =>
            String(u.id_equipamento) === filtroEq);
        if (filtroStatus) resultado = resultado.filter(u =>
            u.status === filtroStatus);

        renderizarUnidades(resultado);
    }

    // Agrupa as unidades por equipamento e renderiza
    function renderizarUnidades(unidades) {
        const container = document.getElementById("listaUnidades");

        if (unidades.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;color:#8892a4;padding:2rem;">
                    Nenhuma unidade encontrada
                </div>`;
            return;
        }

        // Agrupa por equipamento
        const grupos = {};
        unidades.forEach(u => {
            const key = u.equipamento_nome || "Sem equipamento";
            if (!grupos[key]) grupos[key] = [];
            grupos[key].push(u);
        });

        // Renderiza cada grupo
        container.innerHTML = Object.entries(grupos).map(([equip, units]) => `
            <div style="margin-bottom:1.5rem;">

                <!-- Cabeçalho do grupo -->
                <div style="display:flex;align-items:center;
                            justify-content:space-between;
                            padding:0.75rem 1rem;
                            background:rgba(79,142,247,0.08);
                            border:1px solid rgba(79,142,247,0.15);
                            border-radius:8px 8px 0 0;
                            margin-bottom:0;">
                    <div style="display:flex;align-items:center;gap:0.75rem;">
                        <span style="font-weight:700;color:#e2e8f0;">
                            📦 ${equip}
                        </span>
                        <span style="color:#8892a4;font-size:0.82rem;">
                            ${units.length} unidade(s)
                        </span>
                    </div>
                    <div style="display:flex;gap:0.5rem;">
                        <span class="badge badge-verde">
                            ✅ ${units.filter(u => u.status === 'disponivel').length} disponíveis
                        </span>
                        <span class="badge badge-azul">
                            📤 ${units.filter(u => u.status === 'em_uso').length} em uso
                        </span>
                    </div>
                </div>

                <!-- Tabela de unidades do grupo -->
                <div style="border:1px solid #2a2d3e;
                            border-top:none;border-radius:0 0 8px 8px;
                            overflow-x:auto;overflow-y:hidden;">
                    <table style="margin:0;min-width:650px;">
                        <thead>
                            <tr>
                                <th>Código de Barras</th>
                                <th>Nº Série</th>
                                <th>Status</th>
                                <th>Responsável Atual</th>
                                <th>Cadastrado em</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${units.map(u => `
                                <tr>
                                    <td>
                                        <span style="font-family:monospace;
                                            background:rgba(79,142,247,0.1);
                                            padding:0.2rem 0.5rem;
                                            border-radius:4px;
                                            color:#4f8ef7;font-size:0.85rem;">
                                            📷 ${u.codigo_barras}
                                        </span>
                                    </td>
                                    <td style="color:#8892a4;">
                                        ${u.numero_serie || "-"}
                                    </td>
                                    <td>${seletorStatus(u)}</td>
                                    <td style="color:#8892a4;">
                                        ${u.responsavel_atual || "-"}
                                    </td>
                                    <td style="color:#8892a4;">
                                        ${new Date(u.criado_em)
                                            .toLocaleDateString('pt-BR')}
                                    </td>
                                    <td>
                                        ${usuario.perfil === "admin" ? `
                                            <button class="btn btn-danger"
                                                onclick="deletarUnidade(${u.id},'${u.codigo_barras}')"
                                                style="padding:0.3rem 0.6rem;
                                                       font-size:0.8rem;">🗑️</button>
                                        ` : "-"}
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            </div>
        `).join("");
    }

    function badgeStatus(status) {
        const b = {
            "disponivel": '<span class="badge badge-verde">✅ Disponível</span>',
            "em_uso":     '<span class="badge badge-azul">📤 Em Uso</span>',
            "manutencao": '<span class="badge badge-amarelo">🔧 Manutenção</span>',
            "inativo":    '<span class="badge badge-cinza">⛔ Inativo</span>'
        };
        return b[status] || status;
    }

    // Mesmas cores dos badges (.badge-verde/.badge-azul/.badge-amarelo/.badge-cinza em css/style.css),
    // pra manter a identificação visual por status quando vira um <select> editável.
    const CORES_STATUS = {
        disponivel: { bg: "rgba(34,197,94,0.15)",   cor: "#4ade80" },
        em_uso:     { bg: "rgba(79,142,247,0.15)",  cor: "#7eb3ff" },
        manutencao: { bg: "rgba(245,158,11,0.15)",  cor: "#fbbf24" },
        inativo:    { bg: "rgba(100,116,139,0.15)", cor: "#94a3b8" }
    };
    const OPCOES_STATUS = [
        { valor: "disponivel", texto: "✅ Disponível" },
        { valor: "em_uso",     texto: "📤 Em Uso" },
        { valor: "manutencao", texto: "🔧 Manutenção" },
        { valor: "inativo",    texto: "⛔ Inativo" }
    ];

    function seletorStatus(unidade) {
        if (usuario.perfil !== "admin") {
            return badgeStatus(unidade.status);
        }

        const cor = CORES_STATUS[unidade.status] || CORES_STATUS.disponivel;

        return `
            <select onchange="corrigirStatus(${unidade.id}, this)"
                data-status-atual="${unidade.status}" style="
                padding:0.3rem 0.5rem;border-radius:6px;
                background:${cor.bg};
                border:1px solid ${cor.cor};
                color:${cor.cor};font-size:0.8rem;font-weight:600;cursor:pointer;">
                ${OPCOES_STATUS.map(o => `
                    <option value="${o.valor}" style="background:#1a1f2e;color:#e2e8f0;"
                        ${o.valor === unidade.status ? "selected" : ""}>
                        ${o.texto}
                    </option>
                `).join("")}
            </select>
        `;
    }

    async function corrigirStatus(id, selectEl) {
        const novoStatus  = selectEl.value;
        const statusAtual = selectEl.dataset.statusAtual;
        let responsavel   = null;

        if (novoStatus === "em_uso") {
            responsavel = (prompt("Nome do responsável por essa unidade:") || "").trim();
            if (!responsavel) {
                selectEl.value = statusAtual;
                return;
            }
        } else {
            const rotulo = (OPCOES_STATUS.find(o => o.valor === novoStatus) || {}).texto || novoStatus;
            if (!confirm(`Confirma alterar o status para "${rotulo}"?`)) {
                selectEl.value = statusAtual;
                return;
            }
        }

        try {
            const corpo = { status: novoStatus };
            if (responsavel) corpo.responsavel = responsavel;

            const r = await fetch(`${API_URL}/api/unidades/${id}/status`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(corpo)
            });
            const resultado = await r.json();

            if (r.ok) {
                mostrarSucesso("Status corrigido!");
                carregarUnidades();
            } else {
                mostrarErro(resultado.erro);
                selectEl.value = statusAtual;
            }
        } catch (e) {
            mostrarErro("Erro ao corrigir status");
            selectEl.value = statusAtual;
        }
    }

    async function deletarUnidade(id, codigo) {
        if (!confirm(`Remover a unidade "${codigo}"?`)) return;
        try {
            const r = await fetch(`${API_URL}/api/unidades/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            const resultado = await r.json();
            if (r.ok) { mostrarSucesso(resultado.mensagem); carregarUnidades(); }
            else mostrarErro(resultado.erro);
        } catch (e) { mostrarErro("Erro ao deletar unidade"); }
    }

    // ============================================================
    // Carrega os equipamentos no select de cadastro e no filtro
    // ============================================================
    async function carregarEquipamentos() {
        const r = await fetch(`${API_URL}/api/equipamentos/`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const equipamentos = await r.json();

        const itensCad = [
            { value: "", label: "-- Selecione --", placeholder: true },
            ...equipamentos.map(e => ({ value: String(e.id), label: e.nome }))
        ];
        choicesCadEquipamento.setChoices(itensCad, "value", "label", true);
        choicesCadEquipamento.setChoiceByValue("");

        const selectFiltro = document.getElementById("filtroEquipamento");
        selectFiltro.innerHTML = '<option value="">Todos os equipamentos</option>';
        equipamentos.forEach(e => {
            selectFiltro.innerHTML += `<option value="${e.id}">${e.nome}</option>`;
        });
    }

    function mostrarSucesso(msg) {
        const el = document.getElementById("msgSucesso");
        el.textContent = "✅ " + msg;
        el.style.display = "flex";
        setTimeout(() => el.style.display = "none", 3000);
    }

    function mostrarErro(msg) {
        const el = document.getElementById("msgErro");
        el.textContent = "❌ " + msg;
        el.style.display = "flex";
        setTimeout(() => el.style.display = "none", 4000);
    }

    function sair() {
        localStorage.removeItem("token");
        localStorage.removeItem("usuario");
        window.location.href = "login.html";
    }

    // Inicializa a página
    carregarEquipamentos();
    carregarUnidades();
</script>

</body>
</html>
